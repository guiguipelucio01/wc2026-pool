name: Fetch WC 2026 Results

on:
  schedule:
    - cron: "0,15,30,45 * * * *"   # every 15 min — stays within 100 req/day free tier
  workflow_dispatch:                 # manual trigger: GitHub -> Actions -> Run workflow

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Fetch results and update database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node fetch-results.js
