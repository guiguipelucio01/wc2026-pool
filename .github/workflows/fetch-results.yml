name: Fetch WC 2026 Results

on:
  schedule:
    - cron: "0,10,20,30,40,50 * * * *"   # every 10 min — two entries force GitHub to run both
    - cron: "5,15,25,35,45,55 * * * *"   # offset 5 min — combined = every 5 min
  workflow_dispatch:          # manual trigger: GitHub -> Actions -> Run workflow

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Fetch results and update database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node fetch-results.js
